<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07101f">
<title>YANHAMF AI EA Builder</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#07101f;
color:#f5f7fa;
min-height:100vh;
}

header{
padding:18px;
border-bottom:1px solid #263247;
}

.logo{
display:flex;
align-items:center;
gap:12px;
}

.logoBox{
width:48px;
height:48px;
border:1px solid #d8ad32;
border-radius:14px;
display:flex;
align-items:center;
justify-content:center;
color:#e5bb3f;
font-size:25px;
font-weight:bold;
}

.logoTitle{
font-size:18px;
font-weight:bold;
}

.sub{
color:#8f9aae;
font-size:12px;
margin-top:4px;
}

main{
padding:18px;
padding-bottom:90px;
}

.page{display:none}
.page.active{display:block}

.hero{
background:linear-gradient(145deg,#14233d,#0d1729);
border:1px solid #263754;
border-radius:24px;
padding:25px 20px;
}

.badge{
display:inline-block;
background:#1b2b47;
color:#e5bb3f;
padding:8px 12px;
border-radius:20px;
font-size:11px;
font-weight:bold;
margin-bottom:16px;
}

h1{
font-size:32px;
line-height:1.15;
margin-bottom:14px;
}

.hero p{
color:#aab5c7;
line-height:1.7;
margin-bottom:20px;
}

button{
border:0;
font-weight:bold;
cursor:pointer;
}

.primary{
background:#e5b936;
color:#07101f;
padding:14px 20px;
border-radius:12px;
font-size:15px;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin:16px 0;
}

.card{
background:#0d192d;
border:1px solid #263247;
border-radius:18px;
padding:18px;
}

.number{
color:#e5bb3f;
font-size:25px;
font-weight:bold;
}

.label{
color:#8f9aae;
font-size:13px;
margin-top:6px;
}

.section{
background:#0d192d;
border:1px solid #263247;
border-radius:20px;
padding:18px;
margin-bottom:16px;
}

.section h2{
font-size:21px;
margin-bottom:15px;
}

.step{
background:#101e34;
border:1px solid #23344f;
border-radius:14px;
padding:15px;
margin-top:9px;
line-height:1.5;
}

label{
display:block;
color:#aeb9c9;
font-size:13px;
margin-top:15px;
}

input,textarea,select{
width:100%;
background:#07101f;
border:1px solid #34435d;
color:white;
border-radius:12px;
padding:13px;
font-size:15px;
margin-top:7px;
}

textarea{
height:180px;
resize:vertical;
}

.action{
width:100%;
margin-top:18px;
}

.result{
background:#07101f;
border:1px solid #263247;
border-radius:14px;
padding:15px;
margin-top:15px;
color:#b7c1d
